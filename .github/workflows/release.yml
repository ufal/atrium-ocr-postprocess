# atrium-ocr-postprocess — automated GitHub Release
#
# On a v* tag, create a GitHub Release with auto-generated notes and attach a
# packaged service bundle.
#
# The release certifies its images (atrium-project#81, decided 2026-10-22): the `image` job builds,
# probes, scans and promotes them through the hub's docker-tool.reusable.yml with
# `release-gate: true`, and the release job needs it. A failed test, build, container probe or
# fixable-CRITICAL gate therefore means no release; the release attaches `images.json` (the digest
# each promoted tag resolves to) and its notes open with the digests. docker.yml no longer runs on
# a tag, so one tag run does both (hub docs/ci_policy.md, Releases). A dispatched dry run builds
# and probes the images without pushing them; with `simulate-probe-failure` the probe fails on
# purpose and nothing may be pushed or released.
#
# Since atrium-project#32 round 2 each release also carries the service's OpenAPI document:
# `openapi.json` (service/openapi.json, stamped with the release version) and
# `openapi.json.sha256` — the spec the AMČR pipeline generates its clients from, and the
# digest a running image reports as /info `openapi_sha256`. The release job first checks
# that the committed spec is what this tag's code generates, then compares it with the
# previous release: a breaking change fails the release unless the major version went up.
#
# `workflow_dispatch` is the dry run (atrium-project#40: an immutable release uses up its
# tag, so the gate is proven BEFORE tagging): every check runs against the dispatched ref
# and the latest release, the bundle is built and verified, and nothing is published.

name: Automated Release

# Never cancel a release. The trigger is a tag push, so each run has its own ref and
# overlap is only possible on a re-run of the same tag — where cancelling the first
# could leave a half-published release behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  # The dry run (see the header): no release is created.
  workflow_dispatch:
    inputs:
      simulate-probe-failure:
        description: "Make the container probe fail on purpose (atrium-project#81): nothing may be published."
        type: boolean
        default: false

permissions:
  contents: write   # required to create the Release

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  # A mistagged push (tag != CITATION.cff != para_config.txt [tool] version)
  # fails HERE and blocks the release job below, so nothing gets published.
  # Same check as ufal/atrium-project security.reusable.yml's version-check —
  # both now run the SAME vendored check_version.py, so the two cannot drift
  # apart the way the old inline copies did. It stays a VENDORED FILE rather
  # than a `uses:` on purpose: the guard must not depend on a cross-repo
  # `uses: …@v1` resolving at tag-push time (that ordering gap is
  # what let this repo's own v1.0.0.-beta tag publish). Would have blocked it.
  version-guard:
    name: Verify tag == CITATION.cff == para_config.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Block release on version/tag mismatch
        # Was a ~45-line inline python heredoc, duplicated verbatim across all
        # five release.yml files and again (in a drifted variant) in the hub's
        # security.reusable.yml. Now one vendored script, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml (#18).
        # Kept as a vendored file, not a reusable workflow: this gate must not
        # depend on a cross-repo `uses:` resolving at tag-push time.
        env:
          TAG_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # A dry run (workflow_dispatch on a branch) has no tag to compare; it still checks
          # that CITATION.cff and setup/para_config.txt agree.
          if [ "$REF_TYPE" = "tag" ]; then
            python check_version.py \
              --citation CITATION.cff \
              --para-config setup/para_config.txt \
              --tag "$TAG_REF" \
              --require-tag
          else
            python check_version.py --citation CITATION.cff --para-config setup/para_config.txt
          fi

  # ── The images this release certifies (atrium-project#81) ──────────────────────────────────
  # The one cross-repo `uses:` of this file, by decision: only the hub's reusable builds, probes,
  # scans and promotes the image a release certifies (hub docs/release_trust.md). The inputs are
  # docker.yml's. With release-gate a failed probe leg pushes nothing for any target, and the
  # `release` job below never runs.
  image:
    needs: version-guard
    permissions:
      # docker-tool.reusable.yml's build-and-push uploads the post-publish Trivy SARIF and pushes
      # to GHCR; a reusable's permissions are capped by this block (see docker.yml).
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@18f06680dfb60142eeece2f46189f9a2fa79230a  # v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-ocr-postprocess
      apt-packages: build-essential g++
      # Mirrors this repo's own constraint in setup/requirements.txt. A bare
      # `torch` resolved to whatever the CPU index served that day, so the
      # pre-install and the manifest could disagree run to run (#18).
      pre-install-torch: "torch>=2.1,<3.0"
      requirements: setup/requirements.txt service/requirements.txt setup/requirements-test.txt
      # issue #55: `api` is a new Dockerfile stage. Before it existed this repo's
      # FastAPI service was reachable only via a docker-compose entrypoint override on
      # the batch image, so no runnable API image was published and there was nothing
      # for ARÚP/ARÚB to deploy. Only `api` is probed — `base` is a batch CLI.
      build-targets: '["base", "api"]'
      probe-targets: '["api"]'
      # atrium-project#72: `api` is this stage's production image, the one AMČR pins; its
      # first-party files are declared in .github/production-image.json and checked by
      # workflow-lint. `base` is the batch pipeline (run_pipeline.py): published, never pinned.
      # The probe also fails an image with PyMuPDF installed (the reusable's forbidden-distributions).
      release-gate: true
      simulate-probe-failure: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate-probe-failure }}

  release:
    needs: [version-guard, image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Package service artifact
        run: |
          mkdir -p atrium-service
          cp -r setup/ service/ atrium-service/ 2>/dev/null || true
          cp README.md atrium-service/ 2>/dev/null || true

          # First-party modules reached from service/*.py. Until this list existed the
          # bundle shipped `service/` with none of the root modules it imports, so
          # `service_bundle.zip` raised ImportError on the first `import text_api` --
          # the same defect page-classification hit as its issue #18. The
          # "Verify bundle is self-contained" step below is the guard: add an import
          # and it fails here, not for a user.
          #
          # atrium_document.schema.json rides along as atrium_document.py's companion
          # contract file, and atrium_vocab.schema.json as atrium_vocab.py's.
          # atrium_openapi.py: service/atrium_service.py imports it (lazily) to finish and
          # digest the OpenAPI document -- /openapi.json and /info `openapi_sha256` need it
          # (atrium-project#32 round 2); the closure check below finds that import too.
          # atrium_rocrate.py: the service builds each call's CreateAction, returned as the
          # response's `paradata` (atrium-project#71).
          # record_scoring.py: service/text_api.py and service/text_inference.py import it since
          # v1.13.0-beta (/score_record, shared with score_record.py, atrium-project#72). v1.13.0-beta
          # published its images but no release because this list did not name it;
          # tests/test_release_bundle.py now runs this step's closure check on every push.
          cp atrium_document.py \
             atrium_document.schema.json \
             atrium_openapi.py \
             atrium_paradata.py \
             atrium_rocrate.py \
             atrium_limits.py \
             tool_limits.py \
             atrium_vocab.py \
             atrium_vocab.schema.json \
             para_licenses.py \
             classify_TEXT.py \
             document_hook.py \
             extract_JSON_2_TXT.py \
             page_split.py \
             record_scoring.py \
             text_formats.py \
             text_util.py \
             atrium-service/

          zip -r service_bundle.zip atrium-service/ -x "*/__pycache__/*" "*/.git/*"

      # Dependency-free closure check: walks every .py in the bundle, collects the
      # first-party modules it imports (i.e. names matching a *.py at repo root),
      # and asserts each one is present inside the bundle. Deliberately static --
      # importing the service would pull in torch/transformers and need the full
      # install. Ported from atrium-page-classification, which has run this since its
      # issue #18; this repo packaged a bundle for months with no equivalent check.
      - name: Verify bundle is self-contained
        run: |
          python - <<'PY'
          import ast, os, sys

          BUNDLE = "atrium-service"
          first_party = {f[:-3] for f in os.listdir(".") if f.endswith(".py")}

          def imported(path):
              try:
                  tree = ast.parse(open(path, encoding="utf-8").read())
              except SyntaxError:
                  return set()
              names = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names.add(node.module.split(".")[0])
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          names.add(alias.name.split(".")[0])
              return names

          shipped, needed = set(), {}
          for dirpath, _, files in os.walk(BUNDLE):
              for fname in files:
                  if not fname.endswith(".py"):
                      continue
                  shipped.add(fname[:-3])
                  full = os.path.join(dirpath, fname)
                  for mod in imported(full) & first_party:
                      needed.setdefault(mod, []).append(os.path.relpath(full, BUNDLE))

          missing = {m: v for m, v in needed.items() if m not in shipped}
          for mod, users in sorted(missing.items()):
              print(f"::error::{mod}.py is imported by {', '.join(sorted(set(users)))} but is not in the release bundle")
          if missing:
              print("::error::Release bundle is not self-contained -- add the modules above to the cp list in release.yml")
              sys.exit(1)
          print(f"OK -- bundle is self-contained ({len(shipped)} modules, {len(needed)} first-party imports resolved)")
          PY

      # ── The OpenAPI document (atrium-project#32 item 3) ─────────────────────────
      # Everything below runs the VENDORED atrium_openapi.py (stdlib only, held byte-identical
      # to the hub by para-drift): like check_version.py above, a release gate must not depend
      # on a cross-repo `uses:` resolving at tag-push time (hub docs/docker_gha_roadmap.md §3.3).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the committed spec is what this commit generates
        # The asset below IS service/openapi.json, so it must be current. This workflow cannot
        # see this commit's api-contract or Docker smoke runs, so it checks for itself, with the
        # pinned light test lane (fastapi and pydantic exactly as the image has them; the
        # service imports without torch, since the models load in the lifespan). An import
        # error fails here: a release gate does not skip.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python atrium_openapi.py check --app service.text_api:app --spec service/openapi.json

      - name: Install oasdiff
        # Pinned to the version atrium_openapi.py's rules were measured against. `go install`
        # verifies the module against sum.golang.org; GOTOOLCHAIN=auto fetches the Go version
        # oasdiff's go.mod asks for.
        env:
          OASDIFF_VERSION: v1.32.1
        run: |
          GOTOOLCHAIN=auto go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Stamp the spec and compare it with the previous release
        # stamp: dist/openapi.json (info.version = the release version) + dist/openapi.json.sha256.
        # baseline: the highest release below this tag that carries openapi.json (none → the
        # bootstrap, which passes; an API error fails). compare: a removed reason code always
        # fails; any other breaking change fails unless the major version went up.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python atrium_openapi.py stamp --spec service/openapi.json --para-config setup/para_config.txt --out-dir dist
          printf '%s' "$GH_TOKEN" | python atrium_openapi.py baseline --repo "$GITHUB_REPOSITORY" \
            ${TAG_REF:+--tag "$TAG_REF"} --out "$RUNNER_TEMP/previous.openapi.json" --token-stdin
          python atrium_openapi.py compare --base "$RUNNER_TEMP/previous.openapi.json" --rev dist/openapi.json \
            --para-config setup/para_config.txt --require-oasdiff --summary "$GITHUB_STEP_SUMMARY"

      - name: Write images.json (atrium-project#81)
        # The digests the image job promoted; on a tag the release is only reached when it passed,
        # so an empty output there is a failure, not a release without its images.
        if: github.ref_type == 'tag'
        env:
          IMAGES_JSON: ${{ needs.image.outputs.images-json }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGES_JSON" ]; then
            echo "::error::the image job reported no promoted images; the release would not certify them"
            exit 1
          fi
          mkdir -p dist
          printf '%s\n' "$IMAGES_JSON" | python -m json.tool > dist/images.json
          ( cd dist && sha256sum images.json > images.json.sha256 )
          printf '%s\n\n' "**Images this release certifies** (\`images.json\`, atrium-project#81):" > "$RUNNER_TEMP/notes.md"
          python - <<'PY' >> "$RUNNER_TEMP/notes.md"
          import json
          record = json.load(open("dist/images.json", encoding="utf-8"))
          for entry in record["images"]:
              print(f"- `{entry['image']}:{entry['tag']}` = `{entry['digest']}`")
          PY
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        # SHA-pinned: this action holds `contents: write`. A moving tag can be
        # force-pushed to malicious code -- exactly what happened to
        # aquasecurity/trivy-action in 2026-03 (GHSA-69fq-xp46-6x23). Dependabot
        # keeps the SHA and the trailing version comment in step (#18).
        #
        # The spec is attached in this same step, when the release is created: an immutable
        # release (atrium-project#40) refuses assets added after it is published. The bundle
        # carries service/openapi.json too (it ships service/), unstamped.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # The certified images first, then the generated notes (atrium-project#81).
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            service_bundle.zip
            dist/openapi.json
            dist/openapi.json.sha256
            dist/images.json
            dist/images.json.sha256
