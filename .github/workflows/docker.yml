name: Docker Build & Publish

# A version tag is built, probed, scanned and promoted by release.yml's image job, so the release
# certifies its images (atrium-project#81); this file covers pull requests, and the `:test` image a
# merge into `test` publishes. The `release: published` trigger is gone too: a release created with
# GITHUB_TOKEN never fired it.
on:
  pull_request:
    branches: [master, test]
    # `closed` lets a merge into `test` publish the `:test` image (docker-tool.reusable.yml);
    # an unmerged close runs nothing.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    permissions:
      # security-events:write is required because docker-tool.reusable.yml's
      # build-and-push job uploads the post-publish Trivy SARIF. A reusable
      # workflow's permissions are CAPPED BY THIS BLOCK, so omitting it makes
      # GitHub reject the whole file at parse time with "requesting
      # 'security-events: write', but is only allowed 'security-events: none'"
      # — a startup_failure, not a step failure (#18). Same grant security.yml
      # already makes for its own SARIF upload. Not an escalation: this job
      # already holds packages: write.
      contents: read
      packages: write
      security-events: write
    uses: ufal/atrium-project/.github/workflows/docker-tool.reusable.yml@02cbd0144cfa2d39d981d43eea7f4cd72bed53ba  # v1
    secrets:
      # Explicit instead of `secrets: inherit` — the reusable declares and
      # needs only this one (#18). inherit handed it every repo secret.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      image-name: ufal/atrium-ocr-postprocess
      apt-packages: build-essential g++
      # Mirrors this repo's own constraint in setup/requirements.txt. A bare
      # `torch` resolved to whatever the CPU index served that day, so the
      # pre-install and the manifest could disagree run to run (#18).
      pre-install-torch: "torch>=2.1,<3.0"
      requirements: setup/requirements.txt service/requirements.txt setup/requirements-test.txt
      # issue #55: `api` is a new Dockerfile stage. Before it existed this repo's
      # FastAPI service was reachable only via a docker-compose entrypoint override on
      # the batch image, so no runnable API image was published and there was nothing
      # for ARÚP/ARÚB to deploy. Only `api` is probed — `base` is a batch CLI.
      build-targets: '["base", "api"]'
      probe-targets: '["api"]'
      # atrium-project#72: `api` is this stage's production image, the one AMČR pins; its
      # first-party files are declared in .github/production-image.json and checked by
      # workflow-lint. `base` is the batch pipeline (run_pipeline.py): published, never pinned.
      # The probe also fails an image with PyMuPDF installed (the reusable's forbidden-distributions).
