name: Paradata Canonical Drift
on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  check-drift:
    uses: ufal/atrium-project/.github/workflows/para-drift.reusable.yml@da7a066f5a1c1ecf024f9a8b82cca949a9ee0e91  # v1
    with:
      hub-ref: da7a066f5a1c1ecf024f9a8b82cca949a9ee0e91
      # atrium-project#83: decision_client.py (the decision-model client of tools/decide_lines.py --decide,
      # #10) is page-classification's, pinned by tests/test_vendored_decision_parity.py. The reusable checks
      # the copy against page-classification at the commit the pin adopted.
      vendored-from: atrium-page-classification
