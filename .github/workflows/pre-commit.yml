# atrium-ocr-postprocess — pre-commit in CI
#
# Thin caller for ufal/atrium-project's pre-commit.reusable.yml (#18, T3).
# BLOCKING: a failing hook fails the check. This repo's own
# .pre-commit-config.yaml and ruff.toml still decide WHAT runs; the reusable
# standardises how it is invoked and adds the hook-environment cache.

name: pre-commit

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ufal/atrium-project/.github/workflows/pre-commit.reusable.yml@e11c882f9e005f9bd38e8335bf1521f64dde4a64  # v1
